# =============================================================================
#  ntfy — Push-Benachrichtigungen aufs Handy
#
#  Zweck in diesem Setup: Das taegliche Backup kann fehlschlagen, ohne dass es
#  jemand bemerkt. ntfy schliesst diese Luecke.
#
#  Zugangsdaten stehen in .env (ueber .gitignore ausgeschlossen).
#  Dokumentation: raspi-doku/docs/14-benachrichtigungen.md
# =============================================================================

services:
  ntfy:
    image: binwiederhier/ntfy:v2.27.0
    container_name: ntfy
    restart: unless-stopped

    # "serve" startet den Server mit der Konfiguration aus server.yml
    command: serve

    ports:
      - "2586:80"

    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - /mnt/usb-hdd/ntfy/cache:/var/cache/ntfy
      - /mnt/usb-hdd/ntfy/lib:/var/lib/ntfy

    environment:
      TZ: Europe/Berlin

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/v1/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
