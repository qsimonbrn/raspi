# --- Logrotation -------------------------------------------------------------
#  Docker dreht Logdateien NUR, wenn es beim Erstellen des Containers gesetzt
#  ist. Die Vorgabe in /etc/docker/daemon.json greift erst nach einem echten
#  Daemon-Neustart (ein reload uebernimmt log-opts nicht) -- deshalb steht sie
#  hier ausdruecklich und ueberlebt jede Aenderung am Daemon.
# -----------------------------------------------------------------------------
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# --- Speicher-Limits ---------------------------------------------------------
#  Gesetzt am 20.08.2026 auf Grundlage einer Messung ueber 603 Punkte je
#  Container (18.08. 06:03 bis 20.08. 11:39, alle 5 Minuten). Die Werte sind
#  bewusst grosszuegig: Sie sollen einen ausgerissenen Dienst abfangen, nicht
#  den normalen Betrieb begrenzen. Die Messung tastet alle fuenf Minuten ab und
#  sieht kurze Spitzen -- etwa einen OCR-Lauf -- ueberhaupt nicht; das gemessene
#  Maximum ist deshalb eine Untergrenze.
#
#  Die Summe aller Limits liegt bei 3104 MiB von 3796 MiB RAM. Damit ist nichts
#  ueberbucht: Selbst wenn alle Container gleichzeitig anschlagen, bleibt dem
#  System Luft. Ein Limit greift ERST, wenn der Container neu erzeugt wird --
#  ein Neustart genuegt nicht.
# -----------------------------------------------------------------------------

services:
  bichon:
    # Bichon veroeffentlicht keine Versions-Tags. Festgenagelt auf den Digest des
    # Standes vom 07.12.2025, der hier laeuft -- damit ein Pull nichts austauscht.
    image: rustmailer/bichon@sha256:576670754c9902b256af8fe8ff5d64f4c49318442d112809ee2bc7bb697145a4
    container_name: bichon
    logging: *logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # gemessenes Maximum 462 MiB (20.08.2026)
    mem_limit: 768m

    # Geheimnis steht in .env (Modus 660, ueber .gitignore ausgeschlossen).
    env_file:
      - .env

    environment:
      BICHON_LOG_LEVEL: info
      BICHON_ROOT_DIR: /data
      BICHON_ENABLE_ACCESS_TOKEN: "true"
      # BICHON_ENCRYPT_PASSWORD kommt aus .env (siehe env_file oben) und wird
      # deshalb hier nicht mehr aufgefuehrt. Der Wert kann NICHT geaendert
      # werden, ohne das Archiv unlesbar zu machen -- Herstellerdoku:
      # "Once the password is set, it cannot be changed."

      # Optional: CORS einschränken (empfohlen für „richtigen“ Betrieb)
      # Wenn du NUR lokal zugreifst, kannst du es erstmal weglassen.
      #BICHON_CORS_ORIGINS: |
      #  http://192.168.178.50:15630

    volumes:
      # Speicherort der Archive auf dem Pi
      - /mnt/usb-hdd/bichon:/data:rw

    ports:
      # WebUI & API
      - "15630:15630"
