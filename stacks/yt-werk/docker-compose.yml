# =============================================================================
#  yt-werk -- holt Playlist-Eintraege, Metadaten und Transkripte von YouTube
#             und legt sie im Eingang des Second Brain ab.
#
#  Kein Port auf dem Host. Der Dienst haengt mit n8n im Docker-Netz
#  "werkbank" und ist nur unter http://yt-werk:8722 erreichbar. Damit ist
#  pi-guard hier NICHT beteiligt -- anders als bei n8n gibt es nichts
#  abzuschotten, weil nichts veroeffentlicht wird.
#
#  Warum es diesen Dienst gibt: die YouTube Data API v3 liefert keine
#  Untertitel fremder Videos, und das n8n-Image bringt kein Python mit.
#
#  Dokumentation: docs/20-yt-werk.md
# =============================================================================

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  yt-werk:
    build: .
    # Version mitziehen, wenn yt-dlp im Dockerfile hochgezogen wird.
    image: yt-werk:1.0.0
    container_name: yt-werk
    restart: unless-stopped
    logging: *logging

    # Gleiche UID wie n8n (1000). Beide schreiben in denselben Eingang;
    # unterschiedliche UIDs wuerden dort Dateien hinterlassen, die der
    # jeweils andere nicht anfassen kann.
    user: "1000:1000"

    security_opt:
      - no-new-privileges:true

    # Gemessen im Leerlauf rund 70 MB. Das Limit faengt einen Ausreisser bei
    # einem sehr langen Transkript ab, ohne den Betrieb zu begrenzen.
    mem_limit: 256m

    volumes:
      - /mnt/usb-hdd/second-brain/eingang:/eingang

    environment:
      TZ: Europe/Berlin
      EINGANG: /eingang

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8722/health',timeout=5).status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - werkbank

networks:
  werkbank:
    external: true
