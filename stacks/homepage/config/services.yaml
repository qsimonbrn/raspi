---
# Jeder Dienst hat:
#   href         Ziel beim Anklicken
#   siteMonitor  Live-Erreichbarkeitspruefung (gruener/roter Punkt + Antwortzeit)
#   server/container  Docker-Anbindung -> CPU, RAM und Laufzeit direkt an der Kachel
#
# Neue Container erscheinen NICHT automatisch -- sie werden hier eingetragen.
# Wer echte Auto-Erkennung will, setzt Labels am Container (siehe README).

- Netzwerk & DNS:
    - Pi-hole:
        href: http://192.168.178.80/admin
        siteMonitor: http://192.168.178.80/admin
        description: DNS, Werbeblocker, lokale Namen
        icon: pi-hole.png
        # Widget zeigt geblockte Anfragen direkt auf der Kachel.
        # Aktivieren: Passwort der Weboberflaeche unter "key" eintragen
        # und die drei Zeilen einkommentieren.
        # widget:
        #   type: pihole
        #   url: http://192.168.178.80
        #   version: 6
        #   key: DEIN_PIHOLE_PASSWORT

    - Tailscale:
        href: https://login.tailscale.com/admin/machines
        description: VPN-Zugang von aussen (Mesh, kein Portforward)
        icon: tailscale.png

- Dokumente & Daten:
    - Paperless-ngx:
        href: http://100.108.219.87:8000
        siteMonitor: http://100.108.219.87:8000
        description: Dokumentenarchiv mit OCR
        icon: paperless-ngx.png
        server: pi
        container: paperless

    - Bichon:
        href: http://100.108.219.87:15630
        siteMonitor: http://100.108.219.87:15630
        description: E-Mail-Archiv
        icon: mdi-email-multiple
        server: pi
        container: bichon

    - Vaultwarden:
        # Bewusst OHNE siteMonitor. Der Dienst haengt hinter
        # "tailscale serve" und ist nur unter seinem Tailnet-Namen mit
        # gueltigem Zertifikat erreichbar. Der Pi nimmt MagicDNS nicht an
        # (CorpDNS=false, er ist selbst der DNS-Server), also koennte der
        # homepage-Container den Namen gar nicht aufloesen -- die Kachel
        # stuende dauerhaft auf Rot. Ein Punkt, der immer rot ist, sagt
        # nichts mehr; man gewoehnt sich an ihn und uebersieht dann den
        # echten Ausfall. Den Zustand liefert stattdessen die
        # Docker-Anbindung unten (laeuft / laeuft nicht, CPU, RAM).
        href: https://raspberrypi.tailf372ec.ts.net:8443
        description: Passwort-Tresor, nur ueber Tailscale erreichbar
        icon: vaultwarden.png
        server: pi
        container: vaultwarden

- Verwaltung:
    - Portainer:
        href: http://100.108.219.87:9000
        siteMonitor: http://100.108.219.87:9000
        description: Container-Verwaltung
        icon: portainer.png
        server: pi
        container: portainer

    - ntfy:
        href: http://192.168.178.80:2586
        siteMonitor: http://192.168.178.80:2586/v1/health
        description: Push-Benachrichtigungen, u. a. vom Backup
        icon: ntfy.png
        server: pi
        container: ntfy

    - Samba:
        href: smb://192.168.178.80/usb-share
        description: Netzlaufwerk usb-share
        icon: mdi-folder-network
