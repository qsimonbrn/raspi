# --- Logrotation -------------------------------------------------------------
#  Docker dreht Logdateien NUR, wenn es beim Erstellen des Containers gesetzt
#  ist. Die Vorgabe in /etc/docker/daemon.json greift erst nach einem echten
#  Daemon-Neustart (ein reload uebernimmt log-opts nicht) -- deshalb steht sie
#  hier ausdruecklich und ueberlebt jede Aenderung am Daemon.
# -----------------------------------------------------------------------------
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  portainer:
    image: portainer/portainer-ce:2.39.6
    container_name: portainer
    logging: *logging
    security_opt:
      - no-new-privileges:true
    restart: always
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
