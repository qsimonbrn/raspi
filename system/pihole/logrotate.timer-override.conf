# /etc/systemd/system/logrotate.timer.d/override.conf
# Seit 25.10.2026. Pi-holes eigener Cronjob "pihole flush once" (00:00) ruft
# logrotate --force auf dieselben Dateien auf wie der System-logrotate. Liefen
# beide in derselben Sekunde, benannten sie sich gegenseitig die Dateien weg
# und logrotate.service endete "failed". Der System-Lauf wird deshalb auf
# 00:30 verschoben; AccuracySec verhindert, dass systemd ihn wieder an 00:00
# heranschiebt. Preis: Pi-hole-Logs werden doppelt rotiert (bewusst gewaehlt).
[Timer]
OnCalendar=
OnCalendar=*-*-* 00:30:00
AccuracySec=1min
