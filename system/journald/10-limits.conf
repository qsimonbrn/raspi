# Obergrenze fuer das systemd-Journal.
#
# Ohne diese Datei gilt der Standard: 10 % des Dateisystems, gedeckelt bei 4 GB.
# Das Wurzeldateisystem liegt auf der SD-Karte von 02/2023 -- dem wahrscheinlichsten
# Ausfall dieser Anlage. 4 GB Logbuch dort sind weder noetig noch gewollt.
#
# Am 07.09.2026 gesetzt, nachdem die Behauptungspruefung ein Wachstum von 87 % in drei
# Tagen meldete (39 -> 73 MB). Das war kein Fehler, sondern schlicht eine fehlende
# Grenze: Ueber die Haelfte des Aufkommens ist eine einzige, sich wiederholende
# Tailscale-Meldung ("derp-4 does not know about peer ..., removing route"), die
# entsteht, wenn ein Geraet staendig schlafen geht und aufwacht.
#
# Die Grenze aendert NICHT, wie viel geschrieben wird -- nur, wie lange Altes
# aufgehoben wird, bevor journald es loescht. Bei rund 10 MB pro Tag reichen 500 MB
# fuer etwa sieben Wochen Verlauf.
#
# Quelle im Repository: system/journald/10-limits.conf des Repositories qsimonbrn/raspi.
# Nach einer Aenderung: sudo systemctl restart systemd-journald
#
# Nachweis, dass die Datei gelesen wurde -- journald meldet seine geltende Grenze beim
# Start selbst:
#   sudo journalctl -t systemd-journald --since "-2 min" -o cat | grep "max "
# Vor dieser Datei stand dort "max 4.0G", danach muss "max 500.0M" stehen. Steht dort
# weiterhin 4.0G, wurde die Datei nicht gelesen -- ein blosser Neustart ohne Fehler
# beweist gar nichts.

[Journal]
SystemMaxUse=500M
SystemMaxFileSize=100M
